<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG House and Garden</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #263238;
            --muted: #5f716e;
            --paper: #fffdf7;
            --line: #d9e6df;
            --accent: #e67e52;
            --green: #387c5a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            background: #e8f0eb;
        }

        .page {
            width: min(1180px, 92vw);
            margin: 0 auto;
            padding: 3rem 0;
        }

        header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 2rem;
            margin-bottom: 1.5rem;
        }

        .kicker {
            margin: 0 0 .5rem;
            color: var(--accent);
            font: 700 .75rem/1.2 Arial, sans-serif;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.4rem, 6vw, 5rem);
            line-height: .95;
            letter-spacing: -.04em;
        }

        .intro {
            max-width: 27rem;
            margin: 0;
            color: var(--muted);
            font: 1rem/1.6 Arial, sans-serif;
        }

        .artboard {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--paper);
            box-shadow: 0 20px 45px rgba(47, 76, 64, .12);
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .key {
            display: flex;
            flex-wrap: wrap;
            gap: .65rem 1.2rem;
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font: .8rem Arial, sans-serif;
        }

        .key span::before {
            content: "";
            display: inline-block;
            width: .6rem;
            height: .6rem;
            margin-right: .4rem;
            border-radius: 50%;
            background: var(--accent);
        }

        .key span:nth-child(2)::before { background: var(--green); }
        .key span:nth-child(3)::before { background: #e4b957; }
        .key span:nth-child(4)::before { background: #709ec4; }

        @media (max-width: 700px) {
            .page { padding: 1.5rem 0; }
            header { display: block; }
            .intro { margin-top: 1rem; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header>
            <div>
                <p class="kicker">COS30045 · SVG study</p>
                <h1>Willow Cottage</h1>
            </div>
            <p class="intro">A small illustrated garden scene built entirely with SVG shapes, paths, text, groups, transformations and styling.</p>
        </header>

        <section class="artboard" aria-label="An SVG illustration of a house and garden">
            <svg viewBox="0 0 1200 700" role="img" aria-labelledby="scene-title scene-desc">
                <title id="scene-title">Willow Cottage and garden</title>
                <desc id="scene-desc">A warm yellow house with a red roof, trees, flowers, a winding path and a sun in a green garden.</desc>

                <defs>
                    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#cbe8ed" />
                        <stop offset="1" stop-color="#f8e8c7" />
                    </linearGradient>
                    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#fff2bd" />
                        <stop offset="1" stop-color="#edc56d" />
                    </linearGradient>
                    <pattern id="brick" width="34" height="18" patternUnits="userSpaceOnUse">
                        <path d="M0 0H34M0 18H34M17 0V9M0 9H17M17 9V18" fill="none" stroke="#d8a957" stroke-width="1" opacity=".35" />
                    </pattern>
                    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
                        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#31594a" flood-opacity=".2" />
                    </filter>
                </defs>

                <!-- Background shapes -->
                <rect width="1200" height="700" fill="url(#sky)" />
                <circle cx="1015" cy="112" r="58" fill="#f6c85f" opacity=".95" />
                <g fill="#ffffff" opacity=".68">
                    <ellipse cx="170" cy="130" rx="88" ry="24" />
                    <ellipse cx="230" cy="118" rx="62" ry="31" />
                    <ellipse cx="800" cy="145" rx="78" ry="22" />
                    <ellipse cx="850" cy="132" rx="50" ry="28" />
                </g>
                <path d="M0 430 Q170 360 350 430 T700 420 T1050 410 T1200 430 V700 H0Z" fill="#8fbd78" />
                <path d="M0 500 Q210 430 420 505 T820 490 T1200 500 V700 H0Z" fill="#5f9b67" />

                <!-- Tree group: one definition-like composition moved with transform -->
                <g id="tree" transform="translate(100 275)" aria-label="A tree">
                    <path d="M54 175 Q66 105 59 55" fill="none" stroke="#704d35" stroke-width="22" stroke-linecap="round" />
                    <path d="M59 89 L20 45 M60 80 L105 34" fill="none" stroke="#704d35" stroke-width="9" stroke-linecap="round" />
                    <circle cx="22" cy="35" r="42" fill="#39765a" />
                    <circle cx="79" cy="27" r="53" fill="#4f8f61" />
                    <circle cx="125" cy="65" r="39" fill="#39765a" />
                    <circle cx="62" cy="70" r="48" fill="#6aa66c" />
                </g>
                <use href="#tree" transform="translate(800 15) scale(.9)" aria-label="A large tree on the right" />

                <!-- House group demonstrates grouping and a shared transform -->
                <g id="cottage" transform="translate(365 185)" filter="url(#soft-shadow)">
                    <rect x="0" y="160" width="460" height="250" rx="4" fill="url(#wall)" stroke="#a86c43" stroke-width="5" />
                    <rect x="0" y="160" width="460" height="250" fill="url(#brick)" opacity=".55" />
                    <path d="M-35 165 L225 0 L495 165 Z" fill="#c96b4e" stroke="#854838" stroke-width="7" stroke-linejoin="round" />
                    <path d="M225 12 L225 160" stroke="#eaa06c" stroke-width="5" />
                    <rect x="190" y="272" width="78" height="138" rx="36" fill="#6d4f48" stroke="#503a38" stroke-width="5" />
                    <circle cx="250" cy="345" r="6" fill="#f5d17a" />
                    <g id="windows" fill="#8fc7d0" stroke="#604a42" stroke-width="5">
                        <g transform="translate(48 220)">
                            <rect width="105" height="90" rx="5" />
                            <path d="M52 0V90M0 45H105" fill="none" />
                        </g>
                        <g transform="translate(307 220)">
                            <rect width="105" height="90" rx="5" />
                            <path d="M52 0V90M0 45H105" fill="none" />
                        </g>
                    </g>
                    <text x="230" y="205" text-anchor="middle" fill="#754333" font-size="23" font-weight="bold">WILLOW COTTAGE</text>
                </g>

                <!-- Curved path -->
                <path d="M594 770 C570 685 580 650 594 620" fill="none" stroke="#e2bd79" stroke-width="76" stroke-linecap="round" />
                <path d="M594 770 C570 685 580 650 594 620" fill="none" stroke="#f1d59a" stroke-width="64" stroke-linecap="round" stroke-dasharray="4 14" />

                <!-- Flower group repeated through transformations -->
                <g id="flower" transform="translate(260 560)">
                    <path d="M0 35 Q-4 0 0 -28" fill="none" stroke="#39765a" stroke-width="6" />
                    <circle cx="0" cy="-38" r="13" fill="#e67e52" />
                    <circle cx="13" cy="-28" r="13" fill="#e67e52" />
                    <circle cx="-13" cy="-28" r="13" fill="#e67e52" />
                    <circle cx="0" cy="-25" r="8" fill="#f5ca55" />
                </g>
                <use href="#flower" transform="translate(90 35) scale(.8) rotate(-12 260 560)" />
                <use href="#flower" transform="translate(-70 72) scale(.65) rotate(16 260 560)" />
                <use href="#flower" transform="translate(-135 15) scale(.7) rotate(-18 260 560)" />
                <use href="#flower" transform="translate(700 10) scale(.8) rotate(12 260 560)" />
                <use href="#flower" transform="translate(825 55) scale(.65) rotate(-10 260 560)" />

                <!-- Foreground styling details -->
                <path d="M0 650 Q100 625 205 650 T410 650 T620 650 T830 650 T1200 650" fill="none" stroke="#39765a" stroke-width="6" opacity=".7" />
                <g fill="#fff3d1" font-family="Arial, sans-serif">
                    <text x="48" y="630" font-size="16" letter-spacing="2">A QUIET PLACE TO GROW</text>
                    <text x="1030" y="650" font-size="18" text-anchor="middle">EST. 1926</text>
                </g>
            </svg>
            <div class="key" aria-label="SVG features demonstrated">
                <span>Shapes</span>
                <span>Paths</span>
                <span>Text</span>
                <span>Groups + transforms + styling</span>
            </div>
        </section>
    </main>
</body>
</html>
